name: Alt text audit

on:
  push:
    branches: [main]
    paths-ignore: [alt-audit.csv]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages("stringr")'

      - name: Clone lessons
        run: bash clone-lessons.sh

      - name: Run audit
        working-directory: lessons
        run: Rscript ../audit.R ../alt-audit.csv

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alt-audit.csv
          git diff --cached --quiet || git commit -m "Update alt text audit results"
          git push
